name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older run if a newer one starts on the same ref. Saves CI minutes
# when someone pushes a fixup before the previous run finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # better-sqlite3 needs to compile a native binding for the unit tests.
      # The `onlyBuiltDependencies` allowlist in package.json approves the
      # build script automatically.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-aware lint rules (typescript-eslint/no-unsafe-*) need the
      # generated wrangler `Env` and react-router `Route.*` types. Run the
      # typegen + typecheck step first so lint isn't flagging every binding
      # access as "unsafe assignment of an error typed value". turbo runs
      # each task across every workspace (@pvtch/core, @pvtch/storage).
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Unit and E2E tests. The lingo E2E suite probes the AI binding in
      # beforeAll and skips itself if the binding isn't reachable (CI has no
      # Cloudflare credentials), so it won't fail the build. Storage tests run
      # SQL on workerd's SQLite through Miniflare.
      - name: Tests
        run: pnpm test
